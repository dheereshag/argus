name: quality

# NASA rule 10 — all warnings active, and addressed before release.
#
# The rule targets a C compiler; here the equivalents are ruff and mypy, and
# "addressed before release" means the job fails rather than annotates. A
# warning that does not block a merge is a warning nobody reads.
#
# This is the lint and type half of the gate. The accuracy-regression half
# lives in issue #11 and needs data/labels.csv to exist first.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-type:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Sync dependencies
        # Also the reproducible-build check from issue #9: this resolves from a
        # clean cache, so an undeclared-but-transitively-present import fails
        # here rather than on a deploy.
        run: uv sync --all-extras

      - name: Ruff (lint)
        run: uv run ruff check --output-format=github .

      - name: Ruff (format check)
        run: uv run ruff format --check .

      - name: Mypy (types)
        run: uv run mypy app/

  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Sync dependencies
        run: uv sync --all-extras

      - name: Pytest
        # filterwarnings = ["error"] in pyproject.toml means an unexpected
        # DeprecationWarning fails the run. That is the point of rule 10.
        run: uv run pytest -q
