<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-label="Argus — automatic number plate recognition">
  <title>Argus</title>
  <desc>Isometric scanner tower reading a vehicle number plate</desc>

  <defs>
    <linearGradient id="faceTop" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5EEAD4"/>
      <stop offset="100%" stop-color="#22D3EE"/>
    </linearGradient>
    <linearGradient id="faceLeft" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0E7490"/>
      <stop offset="100%" stop-color="#0C4A6E"/>
    </linearGradient>
    <linearGradient id="faceRight" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#155E75"/>
      <stop offset="100%" stop-color="#082F49"/>
    </linearGradient>

    <linearGradient id="plateTop" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#A78BFA"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
    <linearGradient id="plateLeft" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5B21B6"/>
      <stop offset="100%" stop-color="#3B0764"/>
    </linearGradient>
    <linearGradient id="plateRight" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4C1D95"/>
      <stop offset="100%" stop-color="#2E1065"/>
    </linearGradient>

    <linearGradient id="wordmark" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#67E8F9"/>
      <stop offset="55%" stop-color="#A78BFA"/>
      <stop offset="100%" stop-color="#F0ABFC"/>
    </linearGradient>

    <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5EEAD4" stop-opacity="0"/>
      <stop offset="45%" stop-color="#5EEAD4" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#22D3EE" stop-opacity="0"/>
    </linearGradient>

    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>

    <pattern id="isoGrid" width="68" height="40" patternUnits="userSpaceOnUse">
      <path d="M0 20 L34 0 L68 20 L34 40 Z" fill="none" stroke="#38BDF8" stroke-opacity="0.10" stroke-width="1"/>
    </pattern>

    <symbol id="cube" viewBox="-40 -6 80 76" overflow="visible">
      <polygon points="0,0 34,20 0,40 -34,20" fill="url(#faceTop)"/>
      <polygon points="-34,20 0,40 0,68 -34,48" fill="url(#faceLeft)"/>
      <polygon points="34,20 0,40 0,68 34,48" fill="url(#faceRight)"/>
      <polyline points="-34,20 0,0 34,20" fill="none" stroke="#CFFAFE" stroke-opacity="0.55" stroke-width="1.2"/>
    </symbol>

    <symbol id="slab" viewBox="-40 -6 80 76" overflow="visible">
      <polygon points="0,0 34,20 0,40 -34,20" fill="url(#plateTop)"/>
      <polygon points="-34,20 0,40 0,54 -34,34" fill="url(#plateLeft)"/>
      <polygon points="34,20 0,40 0,54 34,34" fill="url(#plateRight)"/>
      <polyline points="-34,20 0,0 34,20" fill="none" stroke="#EDE9FE" stroke-opacity="0.5" stroke-width="1.2"/>
    </symbol>
  </defs>

  <rect width="1200" height="340" fill="url(#isoGrid)"/>
  <ellipse cx="250" cy="215" rx="230" ry="120" fill="url(#glow)"/>

  <g transform="translate(150 60)">
    <ellipse cx="120" cy="238" rx="150" ry="42" fill="#0EA5E9" opacity="0.12"/>

    <use href="#slab" x="52"  y="176"/>
    <use href="#slab" x="120" y="216"/>
    <use href="#slab" x="188" y="176"/>
    <use href="#slab" x="120" y="136"/>

    <use href="#cube" x="120" y="150"/>
    <use href="#cube" x="120" y="108"/>
    <use href="#cube" x="120" y="66"/>

    <use href="#cube" x="52"  y="130" opacity="0.75"/>
    <use href="#cube" x="188" y="130" opacity="0.75"/>

    <g transform="translate(120 40)">
      <polygon points="0,0 34,20 0,40 -34,20" fill="#0F172A" stroke="#67E8F9" stroke-width="1.5"/>
      <circle cx="0" cy="20" r="11" fill="#0F172A" stroke="#5EEAD4" stroke-width="2"/>
      <circle cx="0" cy="20" r="4.5" fill="#5EEAD4">
        <animate attributeName="r" values="4.5;6.5;4.5" dur="2.6s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="1;0.55;1" dur="2.6s" repeatCount="indefinite"/>
      </circle>
    </g>

    <g opacity="0.85">
      <polygon points="120,72 210,124 120,176 30,124" fill="url(#beam)">
        <animate attributeName="opacity" values="0.15;0.75;0.15" dur="3.2s" repeatCount="indefinite"/>
      </polygon>
    </g>

    <g transform="translate(120 196)">
      <polygon points="0,0 46,27 0,54 -46,27" fill="#020617" opacity="0.9"/>
      <text x="0" y="34" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace"
            font-size="15" font-weight="600" fill="#5EEAD4" letter-spacing="1">RJ14</text>
    </g>
  </g>

  <g transform="translate(560 128)">
    <text x="3" y="4" font-family="ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif"
          font-size="92" font-weight="800" fill="#1E293B" opacity="0.35" letter-spacing="6">ARGUS</text>
    <text x="0" y="0" font-family="ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif"
          font-size="92" font-weight="800" fill="url(#wordmark)" letter-spacing="6">ARGUS</text>

    <rect x="4" y="26" width="92" height="3" rx="1.5" fill="#5EEAD4"/>

    <text x="4" y="66" font-family="ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif"
          font-size="21" font-weight="500" fill="#94A3B8" letter-spacing="0.4">
      Automatic number plate recognition
    </text>
    <text x="4" y="98" font-family="ui-monospace,SFMono-Regular,Menlo,monospace"
          font-size="14.5" fill="#64748B" letter-spacing="2.4">
      FASTAPI · YOLO v11 · MULTI-ENGINE OCR
    </text>
  </g>
</svg>
