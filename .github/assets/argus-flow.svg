<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 250" width="1100" height="250" role="img" aria-label="Capture, screen, read, respond">
  <title>Argus request flow</title>
  <desc>Four isometric stages: capture, screen, read, respond</desc>

  <defs>
    <linearGradient id="tA" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#7DD3FC"/><stop offset="100%" stop-color="#38BDF8"/></linearGradient>
    <linearGradient id="tB" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#5EEAD4"/><stop offset="100%" stop-color="#14B8A6"/></linearGradient>
    <linearGradient id="tC" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#C4B5FD"/><stop offset="100%" stop-color="#8B5CF6"/></linearGradient>
    <linearGradient id="tD" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#F0ABFC"/><stop offset="100%" stop-color="#D946EF"/></linearGradient>
    <linearGradient id="sideL" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#1E293B"/><stop offset="100%" stop-color="#0F172A"/></linearGradient>
    <linearGradient id="sideR" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#162032"/><stop offset="100%" stop-color="#020617"/></linearGradient>

    <symbol id="tile" viewBox="-70 -8 140 110" overflow="visible">
      <polygon points="-58,34 0,68 0,92 -58,58" fill="url(#sideL)"/>
      <polygon points="58,34 0,68 0,92 58,58" fill="url(#sideR)"/>
    </symbol>
  </defs>

  <g font-family="ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif">

    <g transform="translate(140 60)">
      <use href="#tile"/>
      <polygon points="0,0 58,34 0,68 -58,34" fill="url(#tA)"/>
      <g transform="translate(0 34)" fill="#0F172A" opacity="0.85">
        <rect x="-19" y="-12" width="38" height="26" rx="4"/>
        <circle cx="0" cy="1" r="7.5" fill="#7DD3FC"/>
        <rect x="-7" y="-18" width="14" height="6" rx="2"/>
      </g>
      <text x="0" y="118" text-anchor="middle" font-size="17" font-weight="600" fill="#E2E8F0">Capture</text>
      <text x="0" y="140" text-anchor="middle" font-size="13" fill="#64748B">Upload a frame</text>
    </g>

    <g transform="translate(400 60)">
      <use href="#tile"/>
      <polygon points="0,0 58,34 0,68 -58,34" fill="url(#tB)"/>
      <g transform="translate(0 34)" fill="none" stroke="#0F172A" stroke-width="2.6" opacity="0.85">
        <rect x="-21" y="-13" width="42" height="26" rx="4"/>
        <path d="M-13 3 L-5 3 L-1 -5 L4 8 L8 3 L14 3"/>
      </g>
      <text x="0" y="118" text-anchor="middle" font-size="17" font-weight="600" fill="#E2E8F0">Screen</text>
      <text x="0" y="140" text-anchor="middle" font-size="13" fill="#64748B">Vehicle checks</text>
    </g>

    <g transform="translate(660 60)">
      <use href="#tile"/>
      <polygon points="0,0 58,34 0,68 -58,34" fill="url(#tC)"/>
      <g transform="translate(0 34)" fill="#0F172A" opacity="0.85">
        <rect x="-22" y="-11" width="44" height="22" rx="4"/>
        <rect x="-16" y="-4" width="32" height="3.4" rx="1.7" fill="#DDD6FE"/>
        <rect x="-16" y="2.6" width="21" height="3.4" rx="1.7" fill="#DDD6FE"/>
      </g>
      <text x="0" y="118" text-anchor="middle" font-size="17" font-weight="600" fill="#E2E8F0">Read</text>
      <text x="0" y="140" text-anchor="middle" font-size="13" fill="#64748B">Multi-engine OCR</text>
    </g>

    <g transform="translate(920 60)">
      <use href="#tile"/>
      <polygon points="0,0 58,34 0,68 -58,34" fill="url(#tD)"/>
      <g transform="translate(0 34)">
        <rect x="-23" y="-11" width="46" height="22" rx="4" fill="#0F172A" opacity="0.85"/>
        <text x="0" y="5" text-anchor="middle" font-family="ui-monospace,Menlo,monospace"
              font-size="12" font-weight="700" fill="#F5D0FE">JSON</text>
      </g>
      <text x="0" y="118" text-anchor="middle" font-size="17" font-weight="600" fill="#E2E8F0">Respond</text>
      <text x="0" y="140" text-anchor="middle" font-size="13" fill="#64748B">Plate and state</text>
    </g>

    <g stroke="#475569" stroke-width="2" stroke-dasharray="5 6" fill="none" opacity="0.75">
      <path d="M212 94 L328 94"/>
      <path d="M472 94 L588 94"/>
      <path d="M732 94 L848 94"/>
    </g>
    <g fill="#64748B">
      <polygon points="328,94 320,90 320,98"/>
      <polygon points="588,94 580,90 580,98"/>
      <polygon points="848,94 840,90 840,98"/>
    </g>
  </g>
</svg>
