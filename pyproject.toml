[project]
name = "argus"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.140.0",
    "httpx>=0.27.0",
    "loguru>=0.7.2",
    "numpy>=2.5.1",
    "onnxruntime>=1.28.0",
    "opencv-python>=5.0.0.93",
    "paddleocr>=2.10.0",
    "paddlepaddle>=3.3.1",
    "pillow>=12.3.0",
    "pytest>=8.0.0",
    "python-decouple>=3.8",
    "python-multipart>=0.0.32",
    "tabulate>=0.10.0",
    "ultralytics>=8.4.106",
    "uvicorn>=0.51.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
# NASA rule 10 — compile with all warnings active and address them.
# Python's analogue: promote warnings to errors in the test run so a
# DeprecationWarning from a pinned library surfaces now, not on upgrade day.
filterwarnings = [
    "error",
    # PaddleOCR 2.x and ultralytics emit these from third-party code we do not
    # control. Scoped narrowly and deliberately, not blanket-ignored.
    "ignore::DeprecationWarning:paddle.*",
    "ignore::DeprecationWarning:paddleocr.*",
    "ignore::UserWarning:ultralytics.*",
    "ignore::starlette.exceptions.StarletteDeprecationWarning",
]

# ---------------------------------------------------------------------------
# NASA rule 10 — all warnings active, all warnings addressed before release.
#
# The rule assumes a C compiler; the equivalent here is a linter and a type
# checker configured to complain, wired into CI so complaints block a merge.
# Rules 1, 2 and 4 are partly machine-checkable, so they are enforced here
# rather than left to review:
#   C901  cyclomatic complexity   -> rule 1 (simple control flow)
#   PLR09 too many branches/args  -> rule 4 (function length)
#   B      bugbear                -> rule 7 (suspicious parameter handling)
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 110
target-version = "py312"
exclude = ["eval_debug_crops", "human_gate_spike", ".venv", "scripts"]

[tool.ruff.lint]
select = [
    "E", "W",      # pycodestyle
    "F",           # pyflakes
    "I",           # import sorting
    "B",           # bugbear
    "C90",         # mccabe complexity
    "PL",          # pylint subset
    "RUF",         # ruff-specific
]
ignore = [
    "E501",        # line length handled by the formatter
    "PLR0913",     # argument count: the strategy signatures are inherently wide
]

[tool.ruff.lint.mccabe]
# Rule 1: simple control flow. The waterfall is the most complex thing here and
# sits comfortably under this once the tier ladder is bounded.
max-complexity = 12

[tool.ruff.lint.pylint]
max-branches = 12
max-statements = 50

[tool.ruff.lint.per-file-ignores]
# Tests assert on internals and repeat themselves by design.
"tests/*" = ["PLR2004", "S101", "PLC0415"]

[tool.mypy]
explicit_package_bases = true
exclude = ["^main\\.py$", "^scripts/"]
python_version = "3.12"
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
warn_unreachable = true
no_implicit_optional = true
check_untyped_defs = true
# Not `strict = true`: this is a pilot, and requiring full annotations on every
# existing function would produce hundreds of findings nobody will read, which
# is how a quality gate gets switched off. These flags catch real bugs -
# unreachable code, implicit Optional, silently-Any returns - without that.
# Tighten toward strict once the pilot ships.

[[tool.mypy.overrides]]
# Third-party packages without type information. Listed individually rather
# than with a global ignore_missing_imports, so a new untyped dependency is a
# visible decision instead of a silent one.
module = [
    "ultralytics.*",
    "paddleocr.*",
    "cv2.*",
    "tabulate.*",
]
ignore_missing_imports = true

