[project]
name = "argus"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.140.0",
    "httpx>=0.27.0",
    "loguru>=0.7.2",
    "numpy>=2.5.1",
    "onnxruntime>=1.28.0",
    "opencv-python>=5.0.0.93",
    "paddleocr>=2.10.0",
    "paddlepaddle<=3.3.1",
    "pillow>=12.3.0",
    "python-multipart>=0.0.32",
    "requests>=2.32.0",
    "ultralytics>=8.4.106",
    "uvicorn>=0.51.0",
]

[dependency-groups]
# Dev-only tools. Install with: uv sync --group dev
dev = [
    "pytest>=8.0.0",
    "tabulate>=0.10.0",   # used by eval.py for formatted reports
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
