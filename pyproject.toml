[project]
name = "argus"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "docling[rapidocr]>=2.120.1",
    "loguru>=0.7.2",
    "numpy>=2.5.1",
    "opencv-python-headless>=5.0.0.93",
    "pillow>=12.3.0",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.15.0",
    "requests>=2.32.0",
    "ultralytics>=8.4.106",
]

[dependency-groups]
# Dev-only tools. Install with: uv sync --group dev
dev = [
    "pytest>=8.0.0",
    "tabulate>=0.10.0",   # used by eval.py for formatted reports
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
